<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie-Humburger</title>
   <link rel="stylesheet" href="style.css">
   <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
   <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
      <header class="header">
      <div class="header-content ">
         <div class="logo">
         <img src="images\foodie hamburger logo.svg" alt="burger-logo">
       </div>
       <div class="hamburger-menu-container">
         <div class="hamburger-menu">
        <span class="hamburger-icon">&#9776;</span>
       </div> 
       </div>
          <nav class="navbar-content">
        <span class="close-icon">&times;</span>
        <a href="#top-picks">Top Picks</a>
        <a href="#whopper">Whopper</a>
        <a href="#stunner-menu">Stunner Menu</a>
        <a href="#foodie-collection">New Foodie Collection</a>
        <a href="#deal">Deal of the Day</a>
       </nav>
      </div>
    </header>
    <main>
     <section class="hero-section">
      <div class="image-container"><img src="images\Group 2.png" alt="Group5"></div>
      <p>Well, You can’t resist anymore!</p>
     </section>
      <section id="top-picks" class="section">
        <h2>Top Picks</h2>
      <div class="image-container"><img src="images\burger1.png" alt="img"></div>
     </section>
      <section id="whopper" class="section">
        <h2>Whopper</h2>
      <div class="image-container"><img src="images/burger2.png" alt="img"></div>
     </section>
      <section id="stunner-menu" class="section">
        <h2>Stunner Menu</h2>
      <div class="image-container"><img src="images\burger3.png" alt="img"></div>
     </section>
       <section id="foodie-collection" class="section">
        <h2>New Foodie Collection</h2>
      <div class="image-container"><img src="images\burger4.png" alt="img"></div>
     </section>
      <section id="deal" class="section">
        <h2>Deal of the Day</h2>
      <div class="image-container"><img src="images\burger5.png" alt="img"></div>
     </section>
     <footer>
      <h3 class="go-to-top"><a href="#">Go to Top</a></h3>
      <p>Made with  ❤️ by Aditi Parihar           </p>

     </footer>
    </main>
    </div>
</body>
</html>
